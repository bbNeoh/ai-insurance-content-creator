<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Insurance Content Creator — Login</title>
<style>
:root {
  --blue-900: #1e3a5f; --blue-800: #1e40af; --blue-700: #1d4ed8;
  --blue-600: #2563eb; --blue-500: #3b82f6; --blue-200: #bfdbfe;
  --blue-100: #dbeafe; --blue-50: #eff6ff;
  --green: #10b981; --red: #ef4444;
  --slate-900: #0f172a; --slate-700: #334155; --slate-600: #475569;
  --slate-500: #64748b; --slate-400: #94a3b8; --slate-300: #cbd5e1;
  --slate-200: #e2e8f0; --slate-100: #f1f5f9; --white: #ffffff;
  --radius: 12px;
  --shadow: 0 8px 32px rgba(0,0,0,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--slate-100); color: var(--slate-900);
  min-height: 100vh; display: flex; flex-direction: column;
}

/* Header */
header {
  background: linear-gradient(135deg, #0d2f6b 0%, #1565c0 55%, #1976d2 100%);
  color: white; padding: 0 24px; height: 64px;
  display: flex; align-items: center;
  box-shadow: 0 4px 24px rgba(0,0,0,0.2);
  position: relative; overflow: hidden;
}
header::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(circle at 20% 50%, rgba(255,255,255,0.06) 0%, transparent 60%),
                    radial-gradient(circle at 80% 20%, rgba(255,255,255,0.04) 0%, transparent 40%);
}
.header-brand { display: flex; align-items: center; gap: 12px; position: relative; }
.header-logo {
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.header-title { font-size: 18px; font-weight: 700; color: white; }
.header-sub { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 1px; }

/* Main */
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }

/* Card */
.auth-card {
  background: var(--white); border: 1px solid var(--slate-200);
  border-radius: var(--radius); width: 100%; max-width: 420px;
  box-shadow: var(--shadow); overflow: hidden;
}
.auth-card-top {
  background: linear-gradient(135deg, #0d2f6b 0%, #1565c0 55%, #1976d2 100%);
  padding: 28px 32px 22px; text-align: center; position: relative; overflow: hidden;
}
.auth-card-top::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(circle at 30% 50%, rgba(255,255,255,0.08) 0%, transparent 60%);
}
.auth-icon { font-size: 40px; margin-bottom: 8px; position: relative; }
.auth-title { font-size: 22px; font-weight: 700; color: white; position: relative; }
.auth-sub { font-size: 13px; color: rgba(255,255,255,0.78); margin-top: 4px; position: relative; }

/* Tabs */
.tab-row { display: flex; border-bottom: 1px solid var(--slate-200); background: var(--slate-50); }
.tab-btn {
  flex: 1; padding: 13px; font-size: 14px; font-weight: 600;
  background: none; border: none; cursor: pointer;
  color: var(--slate-400); transition: all 0.2s;
  border-bottom: 2px solid transparent;
}
.tab-btn.active { color: var(--blue-600); border-bottom-color: var(--blue-600); background: var(--white); }
.tab-btn:hover:not(.active) { color: var(--slate-600); background: var(--slate-100); }

/* Form */
.auth-form { padding: 24px 32px 28px; display: flex; flex-direction: column; gap: 14px; }
.field label {
  display: block; font-size: 11px; color: var(--slate-500); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px;
}
.field input {
  width: 100%; background: var(--slate-50); border: 1.5px solid var(--slate-200);
  color: var(--slate-900); padding: 10px 14px; border-radius: 8px;
  font-size: 14px; transition: border-color 0.2s; font-family: inherit;
}
.field input:focus { outline: none; border-color: var(--blue-500); background: var(--white); }
.field input::placeholder { color: var(--slate-400); }

.btn-submit {
  width: 100%; padding: 12px; border-radius: 8px; border: none;
  background: linear-gradient(135deg, var(--blue-800), var(--blue-600));
  color: white; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-submit:hover { background: linear-gradient(135deg, var(--blue-700), var(--blue-500)); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(37,99,235,0.35); }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.error-msg {
  background: #fef2f2; border: 1px solid #fee2e2;
  border-radius: 8px; padding: 10px 14px; color: #dc2626; font-size: 13px; display: none;
}
.success-msg {
  background: #f0fdf4; border: 1px solid #bbf7d0;
  border-radius: 8px; padding: 10px 14px; color: #166534; font-size: 13px; display: none;
}

.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Footer */
footer { text-align: center; padding: 16px; font-size: 11px; color: var(--slate-400); }

/* Mobile */
@media (max-width: 480px) {
  .auth-form { padding: 20px; }
  .auth-card-top { padding: 22px 20px 18px; }
  .auth-title { font-size: 18px; }
}
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="header-logo">🤖</div>
    <div>
      <div class="header-title">AI Insurance Content Creator</div>
      <div class="header-sub">For Insurance Agents &amp; Financial Advisors</div>
    </div>
  </div>
</header>

<main>
  <div class="auth-card">
    <div class="auth-card-top">
      <div class="auth-icon">🔑</div>
      <div class="auth-title">Welcome Back</div>
      <div class="auth-sub">Sign in to your content workspace</div>
    </div>

    <!-- Tabs -->
    <div class="tab-row">
      <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="registerTab" onclick="switchTab('register')" style="display:none">Create Account</button>
    </div>

    <!-- Login Form -->
    <div class="auth-form" id="loginForm">
      <div class="error-msg" id="loginError"></div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" />
      </div>
      <button class="btn-submit" id="loginBtn" onclick="doLogin()">
        Sign In →
      </button>
    </div>

    <!-- Register Form -->
    <div class="auth-form" id="registerForm" style="display:none">
      <div class="error-msg" id="registerError"></div>
      <div class="success-msg" id="registerSuccess"></div>
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Your name" autocomplete="name" />
      </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password <span style="color:var(--slate-400);font-weight:400">(min 6 characters)</span></label>
        <input type="password" id="regPassword" placeholder="Create a password" autocomplete="new-password" />
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="regConfirm" placeholder="Repeat your password" autocomplete="new-password" />
      </div>
      <button class="btn-submit" id="registerBtn" onclick="doRegister()">
        Create Account →
      </button>
    </div>
  </div>
</main>

<footer>AI Insurance Content Creator &nbsp;·&nbsp; For Insurance Agents &amp; Financial Advisors &nbsp;·&nbsp; © 2026</footer>

<script>
// Check if already logged in
fetch('/auth/me').then(r => {
  if (r.ok) return r.json();
}).then(data => {
  if (data && (data.user || !data.authEnabled)) window.location.href = '/';
}).catch(() => {});

// Check if registration is allowed
fetch('/api/config').then(r => r.json()).then(cfg => {
  if (cfg.allowRegistration) {
    document.getElementById('registerTab').style.display = 'block';
  }
}).catch(() => {});

function switchTab(tab) {
  document.getElementById('loginTab').classList.toggle('active', tab === 'login');
  document.getElementById('registerTab').classList.toggle('active', tab === 'register');
  document.getElementById('loginForm').style.display = tab === 'login' ? 'flex' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'flex' : 'none';
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError(id) { document.getElementById(id).style.display = 'none'; }

async function doLogin() {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  hideError('loginError');
  if (!email || !password) { showError('loginError', 'Please enter your email and password'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Signing in...';

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) { showError('loginError', data.error || 'Login failed'); return; }
    window.location.href = '/';
  } catch (err) {
    showError('loginError', 'Connection error. Please try again.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Sign In →';
  }
}

async function doRegister() {
  const name     = document.getElementById('regName').value.trim();
  const email    = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const confirm  = document.getElementById('regConfirm').value;
  hideError('registerError');
  document.getElementById('registerSuccess').style.display = 'none';

  if (!name || !email || !password) { showError('registerError', 'All fields are required'); return; }
  if (password.length < 6) { showError('registerError', 'Password must be at least 6 characters'); return; }
  if (password !== confirm) { showError('registerError', 'Passwords do not match'); return; }

  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Creating account...';

  try {
    const res = await fetch('/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json();
    if (!res.ok) { showError('registerError', data.error || 'Registration failed'); return; }
    window.location.href = '/';
  } catch (err) {
    showError('registerError', 'Connection error. Please try again.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Create Account →';
  }
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('loginForm').style.display !== 'none') doLogin();
    else doRegister();
  }
});
</script>
</body>
</html>
