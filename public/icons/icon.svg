  <linearGradient id="hx" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#ffe7a3"/></linearGradient></defs>
  <rect width="512" height="512" fill="url(#bg)"/>
